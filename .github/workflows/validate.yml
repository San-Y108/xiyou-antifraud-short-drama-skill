name: Validate skill helpers
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dependency-installer:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test missing installation and no-overwrite behavior
        run: python -m unittest discover -s tests -v
      - name: Check helper entrypoints
        run: |
          python skills/xiyou-antifraud-short-drama/scripts/ensure_dependencies.py --help
          python skills/xiyou-antifraud-short-drama/scripts/verify_video.py --help
